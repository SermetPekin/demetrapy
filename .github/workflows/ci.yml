name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / Java ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
            java: "11"
          - os: ubuntu-latest
            python: "3.13"
            java: "17"
          - os: windows-latest
            python: "3.11"
            java: "11"
          - os: macos-latest
            python: "3.12"
            java: "11"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Cache JDemetra+ core
        uses: actions/cache@v4
        with:
          path: ~/.cache/seasonal-pri
          key: jdemetra-${{ runner.os }}-2.2.6

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip ".[dashboard]"

      - name: Run tests
        run: python -m unittest discover -s tests -v