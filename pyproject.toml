[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "demetrapy"
version = "0.3.4"
description = "Python toolkit for seasonal adjustment with JDemetra+ X13 and TRAMO/SEATS"
authors = [{ name = "Sermet Pekin", email = "sermet.pekin@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
	"JPype1>=1.5,<2",
	"pandas>=2,<4",
	"matplotlib>=3.8,<4",
	"plotly>=6,<7",
	"streamlit>=1.40,<2",
	"openpyxl>=3.1.5",
]
keywords = ["seasonal-adjustment", "jdemetra", "x13", "tramo-seats", "time-series"]
classifiers = [
	"Development Status :: 3 - Alpha",
	"Environment :: Console",
	"Intended Audience :: Financial and Insurance Industry",
	"Intended Audience :: Science/Research",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3 :: Only",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"Topic :: Software Development :: Libraries :: Python Modules",
	"Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
notebook = [
	"ipykernel>=6,<8",
	"notebook>=7,<8",
]
docs = [
	"furo>=2024.8.6",
	"myst-parser>=4,<5",
	"sphinx>=8,<9",
]

[project.urls]
Documentation = "https://demetrapy.readthedocs.io/"
Issues = "https://github.com/SermetPekin/demetrapy/issues"
Repository = "https://github.com/SermetPekin/demetrapy"

[project.scripts]
demetrapy = "demetrapy.cli:main"
demetrapy-dashboard = "demetrapy.dashboard:launch"

[tool.setuptools.packages.find]
where = ["src"]
